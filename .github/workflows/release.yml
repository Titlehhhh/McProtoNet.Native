name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 1.0.0)'
        required: true
        type: string
      tag:
        description: 'libdeflate upstream tag (for example v1.25)'
        required: true
        type: string
      publish:
        description: 'Push the package to nuget.org (otherwise: build, validate, log in, GitHub release only)'
        required: false
        type: boolean
        default: false

env:
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DLIBDEFLATE_BUILD_STATIC_LIB=0
    -DLIBDEFLATE_BUILD_SHARED_LIB=1
    -DLIBDEFLATE_BUILD_GZIP=0
    -DLIBDEFLATE_BUILD_TESTS=0
    -DLIBDEFLATE_COMPRESSION_SUPPORT=1
    -DLIBDEFLATE_DECOMPRESSION_SUPPORT=1
    -DLIBDEFLATE_ZLIB_SUPPORT=1
    -DLIBDEFLATE_GZIP_SUPPORT=1

jobs:
  linux-x64:
    name: linux-x64 (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - run: |
          cmake -B build $CMAKE_FLAGS
          cmake --build build
          mkdir -p out && cp -L build/libdeflate.so out/libdeflate.so
          objdump -T out/libdeflate.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: out/libdeflate.so
          if-no-files-found: error

  linux-musl-x64:
    name: linux-musl-x64 (Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base cmake git
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - run: |
          cmake -B build $CMAKE_FLAGS
          cmake --build build
          mkdir -p out && cp -L build/libdeflate.so out/libdeflate.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-x64
          path: out/libdeflate.so
          if-no-files-found: error

  linux-arm:
    name: ${{ matrix.rid }} (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, distro: bullseye,      rid: linux-arm64 }
          - { arch: armv7,   distro: bullseye,      rid: linux-arm }
          - { arch: armv6,   distro: bullseye,      rid: linux-armv6 }
          - { arch: aarch64, distro: alpine_latest, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ github.token }}
          setup: mkdir -p "${PWD}/out"
          dockerRunArgs: --volume "${PWD}/out:/out"
          env: |
            CMAKE_FLAGS: ${{ env.CMAKE_FLAGS }}
          install: |
            case "${{ matrix.distro }}" in
              alpine*) apk add --no-cache build-base cmake ;;
              *) apt-get update && apt-get install -y build-essential cmake ;;
            esac
          run: |
            cmake -B build $CMAKE_FLAGS
            cmake --build build
            cp -L build/libdeflate.so /out/libdeflate.so
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/libdeflate.so
          if-no-files-found: error

  osx:
    name: osx (universal arm64 + x86_64)
    runs-on: macos-latest
    env:
      CMAKE_OSX_ARCHITECTURES: arm64;x86_64
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - run: |
          cmake -B build $CMAKE_FLAGS
          cmake --build build
          mkdir -p out && cp -L build/libdeflate.dylib out/libdeflate.dylib
          lipo -info out/libdeflate.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: osx
          path: out/libdeflate.dylib
          if-no-files-found: error

  win-mingw:
    name: ${{ matrix.rid }} (mingw cross)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x86, toolchain: scripts/toolchain-i686-w64-mingw32.cmake }
          - { rid: win-x64, toolchain: scripts/toolchain-x86_64-w64-mingw32.cmake }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
      - run: |
          cmake -B build $CMAKE_FLAGS -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}
          cmake --build build
          mkdir -p out && cp build/libdeflate.dll out/libdeflate.dll
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/libdeflate.dll
          if-no-files-found: error

  win-arm64:
    name: win-arm64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ebiggers/libdeflate
          ref: ${{ inputs.tag }}
      - run: >
          cmake -B build -A ARM64
          -DLIBDEFLATE_BUILD_STATIC_LIB=0 -DLIBDEFLATE_BUILD_SHARED_LIB=1
          -DLIBDEFLATE_BUILD_GZIP=0 -DLIBDEFLATE_BUILD_TESTS=0
      - run: cmake --build build --config Release
      - run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/Release/deflate.dll out/libdeflate.dll
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: out/libdeflate.dll
          if-no-files-found: error

  release:
    name: Pack, validate, GitHub release${{ inputs.publish && ', push to nuget.org' || '' }}
    needs: [linux-x64, linux-musl-x64, linux-arm, osx, win-mingw, win-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lay out runtimes and zip per RID
        run: |
          set -e
          mkdir -p package-contents/runtimes zips
          for d in artifacts/*/ ; do
            rid=$(basename "$d")
            mkdir -p "package-contents/runtimes/$rid/native"
            cp "$d"/libdeflate.* "package-contents/runtimes/$rid/native/"
            (cd "$d" && zip -q "../../zips/$rid.zip" libdeflate.*)
          done
          cp package-readme.md package-contents/README.md
          ls -R package-contents
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack
        run: >
          dotnet pack -c Release -o pkg
          -p:PackageVersion=${{ inputs.version }}
          -p:LibdeflateVersion=${{ inputs.tag }}
          -p:Commit=${{ github.sha }}
      - name: Validate package
        run: |
          dotnet tool install -g Meziantou.Framework.NuGetPackageValidation.Tool
          meziantou.validate-nuget-package pkg/*.nupkg             --excluded-rules IconMustBeSet,XmlDocumentationMustBePresent,Symbols,AssembliesMustBeOptimized
      - name: Checksums
        run: |
          (cd zips && sha256sum *.zip) > SHA256SUMS.txt
          (cd pkg && sha256sum *.nupkg) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Log in to nuget.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: Titlehhhh
      - name: Push to nuget.org
        if: ${{ inputs.publish }}
        run: >
          dotnet nuget push pkg/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ inputs.version }}'
          notes="McProtoNet.Native $v. Contents: libdeflate ${{ inputs.tag }} (https://github.com/ebiggers/libdeflate/releases/tag/${{ inputs.tag }}). nuget.org push: ${{ inputs.publish }}."
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" zips/*.zip pkg/*.nupkg SHA256SUMS.txt --clobber
            gh release edit "v$v" --notes "$notes"
          else
            gh release create "v$v" zips/*.zip pkg/*.nupkg SHA256SUMS.txt --title "v$v" --notes "$notes"
          fi
